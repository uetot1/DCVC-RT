<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="trainHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b4aa2"/>
      <stop offset="1" stop-color="#1769c2"/>
    </linearGradient>
    <linearGradient id="testHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08733b"/>
      <stop offset="1" stop-color="#0d9150"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#047857"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 800 38px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .head { font: 800 26px 'Segoe UI', Arial, sans-serif; fill: white; }
      .step { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #243247; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .note { font: italic 600 14px 'Segoe UI', Arial, sans-serif; }
      .boxBlue { fill: white; stroke: #2563eb; stroke-width: 2; rx: 13; }
      .boxGreen { fill: white; stroke: #059669; stroke-width: 2; rx: 13; }
      .boxRed { fill: #fff7f7; stroke: #dc2626; stroke-width: 2; rx: 13; }
      .boxOrange { fill: #fffaf0; stroke: #d97706; stroke-width: 2; rx: 13; }
      .blueArrow { fill: none; stroke: #1d4ed8; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .greenArrow { fill: none; stroke: #047857; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .redArrow { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrowRed); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="52" text-anchor="middle" class="title">DCVC-RT VCM — PIPELINE ĐÚNG VÀ RÚT GỌN</text>

  <!-- TRAIN PANEL -->
  <rect x="28" y="78" width="754" height="738" rx="20" fill="#f8fbff" stroke="#174ea6" stroke-width="2.5" filter="url(#shadow)"/>
  <path d="M48 78 H762 Q782 78 782 98 V138 H28 V98 Q28 78 48 78 Z" fill="url(#trainHead)"/>
  <text x="405" y="117" text-anchor="middle" class="head">1. TRAIN — HỌC TỐI ƯU CHO MÁY</text>

  <rect x="65" y="158" width="680" height="78" class="boxBlue"/>
  <circle cx="91" cy="185" r="17" fill="#1d4ed8"/><text x="91" y="192" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="800" fill="white">1</text>
  <text x="122" y="184" class="step">Lấy clip video liên tiếp</text>
  <text x="122" y="210" class="body">Stage 1: Vimeo7, 3→5→7 frame  •  Stage 2: REDS8/TAD, 8 frame</text>
  <text x="122" y="230" class="small">Stage 2 nạp checkpoint Stage 1 bằng --video-init</text>

  <path d="M405 236 V257" class="blueArrow"/>
  <rect x="65" y="264" width="680" height="68" class="boxBlue"/>
  <circle cx="91" cy="286" r="17" fill="#1d4ed8"/><text x="91" y="293" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="800" fill="white">2</text>
  <text x="122" y="287" class="step">Chọn rate ngẫu nhiên trong mỗi iteration</text>
  <text x="122" y="313" class="body">Offset [0,8,0,4,0,4,0,4]; clip N frame chỉ lấy N giá trị đầu</text>

  <path d="M405 332 V353" class="blueArrow"/>
  <rect x="65" y="360" width="680" height="64" class="boxBlue"/>
  <circle cx="91" cy="381" r="17" fill="#1d4ed8"/><text x="91" y="388" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="800" fill="white">3</text>
  <text x="122" y="382" class="step">Frame 0: RGB → frozen DMCI → I-frame tái tạo → DPB</text>
  <text x="122" y="407" class="note" fill="#1d4ed8">DMCI không nhận gradient; I-frame tạo reference giống lúc test</text>

  <path d="M405 424 V445" class="blueArrow"/>
  <rect x="65" y="452" width="680" height="98" class="boxBlue"/>
  <circle cx="91" cy="475" r="17" fill="#1d4ed8"/><text x="91" y="482" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="800" fill="white">4</text>
  <text x="122" y="477" class="step">P-frame: RGB → BT.709 YCbCr → DMC.forward_train()</text>
  <text x="122" y="504" class="body">Sinh YCbCr tái tạo + R̂ₜ; đổi về RGB cho YOLO và cập nhật DPB</text>
  <text x="122" y="530" class="small">Train không gọi compress()/decompress(), nên chưa tạo bitstream thật</text>

  <path d="M405 550 V571" class="blueArrow"/>
  <rect x="65" y="578" width="320" height="94" class="boxRed"/>
  <text x="225" y="607" text-anchor="middle" class="step">YOLO Teacher — FROZEN</text>
  <text x="225" y="635" text-anchor="middle" class="body">xₜ RGB → {F₁₇, F₂₀, F₂₃}</text>
  <text x="225" y="657" text-anchor="middle" class="small">no_grad()</text>
  <rect x="425" y="578" width="320" height="94" class="boxRed"/>
  <text x="585" y="607" text-anchor="middle" class="step">Clone 0..4 — TRAINABLE</text>
  <text x="585" y="635" text-anchor="middle" class="body">→ backend 5..23 frozen → {F̂₁₇,F̂₂₀,F̂₂₃}</text>
  <text x="585" y="657" text-anchor="middle" class="small">BN/eval giữ ổn định; backend truyền gradient về input</text>

  <path d="M225 672 V695 H360" class="redArrow"/>
  <path d="M585 672 V695 H450" class="redArrow"/>
  <rect x="160" y="701" width="490" height="60" class="boxOrange"/>
  <text x="405" y="727" text-anchor="middle" class="step">L = meanₜ[R̂ₜ + λ_scale·λ(QP)·Σ αᵢ MSE(Fᵢ,F̂ᵢ)]</text>
  <text x="405" y="750" text-anchor="middle" class="small">Feature distortion nhiều tầng; không có Pixel MSE / PSNR</text>

  <path d="M405 761 V781" class="redArrow"/>
  <rect x="145" y="780" width="520" height="28" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="405" y="800" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="800" fill="#b91c1c">BACKPROP CẬP NHẬT DMC + CLONED FRONT END; TEACHER/BACKEND ĐÓNG BĂNG</text>

  <!-- TEST PANEL -->
  <rect x="818" y="78" width="754" height="738" rx="20" fill="#f7fcf9" stroke="#08733b" stroke-width="2.5" filter="url(#shadow)"/>
  <path d="M838 78 H1552 Q1572 78 1572 98 V138 H818 V98 Q818 78 838 78 Z" fill="url(#testHead)"/>
  <text x="1195" y="117" text-anchor="middle" class="head">2. TEST — ĐO RATE VÀ ĐỘ CHÍNH XÁC</text>

  <rect x="855" y="158" width="680" height="72" class="boxGreen"/>
  <circle cx="881" cy="183" r="17" fill="#047857"/><text x="881" y="190" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="800" fill="white">1</text>
  <text x="912" y="182" class="step">Video full-resolution + nhãn YOLO GT</text>
  <text x="912" y="208" class="body">Đánh giá cố định tại 4 rate point: QP = {0, 21, 42, 63}</text>

  <path d="M1195 230 V251" class="greenArrow"/>
  <rect x="855" y="258" width="680" height="64" class="boxGreen"/>
  <circle cx="881" cy="279" r="17" fill="#047857"/><text x="881" y="286" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="800" fill="white">2</text>
  <text x="912" y="280" class="step">Frame 0: frozen DMCI compress() → bitstream → reconstruct</text>
  <text x="912" y="305" class="note" fill="#047857">Tính cả bit và mAP frame 0; ảnh tái tạo được đưa vào DPB</text>

  <path d="M1195 322 V343" class="greenArrow"/>
  <rect x="855" y="350" width="680" height="90" class="boxGreen"/>
  <circle cx="881" cy="374" r="17" fill="#047857"/><text x="881" y="381" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="800" fill="white">3</text>
  <text x="912" y="375" class="step">Frames 1…N: DMC compress() → .bin → decompress()</text>
  <text x="912" y="403" class="body">Actual BPP gồm DMCI + DMC + container/header; reset feature mỗi 32 frame</text>
  <text x="912" y="425" class="small">Toàn bộ codec chạy eval + no_grad; không cập nhật trọng số</text>

  <path d="M1195 440 V461" class="greenArrow"/>
  <rect x="855" y="468" width="680" height="88" class="boxGreen"/>
  <circle cx="881" cy="492" r="17" fill="#047857"/><text x="881" y="499" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="800" fill="white">4</text>
  <text x="912" y="493" class="step">Ảnh RGB tái tạo → clone 0..4 từ checkpoint</text>
  <text x="912" y="521" class="body">→ cùng YOLO backend 5..23 + Detect đóng băng → predictions</text>
  <text x="912" y="543" class="small">Xuất mAP@0.5 và mAP@[0.5:0.95]</text>

  <path d="M1195 556 V577" class="greenArrow"/>
  <rect x="855" y="584" width="680" height="96" class="boxGreen"/>
  <circle cx="881" cy="608" r="17" fill="#047857"/><text x="881" y="615" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="800" fill="white">5</text>
  <text x="912" y="610" class="step">So sánh đúng: DCVC-RT anchor ↔ VCM candidate</text>
  <text x="912" y="638" class="body">Cùng dữ liệu, GT, frozen DMCI/backend, all-frame và cách đếm bit</text>
  <text x="912" y="663" class="body">4 điểm → RD curve → BD-rate–mAP (âm là tốt hơn)</text>

  <rect x="855" y="700" width="680" height="86" class="boxOrange"/>
  <text x="1195" y="728" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="800" fill="#b45309">SO SÁNH HEVC Ở ALL-FRAME PROTOCOL</text>
  <text x="1195" y="753" text-anchor="middle" class="body">Cùng source, nhãn, toàn bộ frame và complete bitstream.</text>
  <text x="1195" y="776" text-anchor="middle" class="small">Khóa rõ RGB444-10bit hoặc raw YUV420; không trộn hai color protocol.</text>

  <!-- FOOTER -->
  <rect x="28" y="837" width="1544" height="42" rx="14" fill="#0f172a"/>
  <text x="800" y="864" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="700" fill="white">Checkpoint lưu DMC + clone 0..4; evaluation nạp đúng frozen YOLO backend và kiểm tra fingerprint weights.</text>
</svg>
